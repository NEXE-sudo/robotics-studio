// AUTH_PROTOCOL_VERSION = 1
syntax = "proto3";

package rosengine;

service RosEngine {
  rpc StreamEvents(Empty) returns (stream WorkspaceEvent);
  rpc ReplayEvents(ReplayEventsRequest) returns (stream WorkspaceEvent);
  rpc PublishTwist(TwistCommand) returns (Empty);
  rpc SetEmergencyStop(EmergencyStopRequest) returns (SafetyState);
  rpc GetSafetyState(Empty) returns (SafetyState);
  rpc GetRobotConfig(RobotConfigRequest) returns (RobotConfig);
  rpc SetRobotConfig(RobotConfig) returns (RobotConfig);
  rpc GetEventHealth(Empty) returns (EventHealth);
  rpc StartTopicInspection(TopicInspectionRequest) returns (Empty);
  rpc StopTopicInspection(TopicInspectionRequest) returns (Empty);
  rpc InvokeSafeService(SafeServiceRequest) returns (SafeServiceResponse);
  rpc SendSafeActionGoal(SafeActionGoalRequest) returns (ActionGoalResponse);
  rpc CancelActionGoal(ActionGoalIdRequest) returns (ActionCancelResponse);
}

message SafeServiceRequest {
  string service_name = 1;
  string service_type = 2;
  string request_json = 3;
  uint32 timeout_ms = 4;
}

message SafeServiceResponse {
  string service_name = 1;
  string service_type = 2;
  string response_json = 3;
  bool truncated = 4;
}

message SafeActionGoalRequest {
  string action_name = 1;
  string action_type = 2;
  string goal_json = 3;
}

message ActionGoalResponse {
  string goal_id = 1;
}

message ActionGoalIdRequest {
  string goal_id = 1;
}

message ActionCancelResponse {
  bool requested = 1;
}

message TopicInspectionRequest {
  string topic_name = 1;
}

message TwistCommand {
  string topic_name = 1;
  double linear_x = 2;
  double angular_z = 3;
  double linear_y = 4;
  double linear_z = 5;
  double angular_x = 6;
  double angular_y = 7;
  int64 timestamp_ns = 8;
}

message Empty {}

message ReplayEventsRequest {
  bool has_after_sequence = 1;
  uint64 after_sequence = 2;
}

message EmergencyStopRequest {
  enum Action {
    ACTION_UNSPECIFIED = 0;
    ACTIVATE = 1;
    RESET = 2;
  }
  Action action = 1;
}

message SafetyState {
  enum State {
    READY = 0;
    ACTIVE = 1;
    RESET_PENDING = 2;
    FAULT = 3;
    DISCONNECTED = 4;
  }
  State state = 1;
  string detail = 2;
  int64 updated_at_ns = 3;
}

message RobotConfigRequest {
  string topic_name = 1;
}

message RobotConfig {
  string topic_name = 1;
  double max_linear_velocity = 2;
  double max_angular_velocity = 3;
  double max_linear_acceleration = 4;
  double max_angular_acceleration = 5;
  uint32 command_lease_ms = 6;
  uint32 command_timeout_ms = 7;
  repeated string permitted_motion_modes = 8;
  bool reset_to_defaults = 9;
}

message EventHealth {
  uint32 queue_capacity = 1;
  uint32 subscriber_count = 2;
  uint64 last_sequence = 3;
  uint64 dropped_telemetry = 4;
  uint64 critical_overflows = 5;
  uint32 max_backlog = 6;
  bool persistence_healthy = 7;
  string persistence_error = 8;
  uint64 oldest_available_sequence = 9;
  uint32 retained_critical_events = 10;
}

message WorkspaceEvent {
  oneof event {
    NodeStarted node_started = 1;
    NodeCrashed node_crashed = 2;
    TopicSnapshot topic_snapshot = 3;
    OdometryUpdate odometry_update = 4;
    TFUpdate tf_update = 5;
    NodeSnapshot node_snapshot = 6;
    SafetyState safety_state = 7;
    EventHealth event_health = 8;
    EventRecovery event_recovery = 9;
    RosGraphSnapshot ros_graph_snapshot = 12;
    JointStateUpdate joint_state_update = 13;
    TopicInspectionUpdate topic_inspection_update = 14;
    ActionGoalUpdate action_goal_update = 15;
  }
  int64 timestamp_ns = 10;
  uint64 sequence = 11;
}

message TopicInspectionUpdate {
  string topic_name = 1;
  string message_type = 2;
  string json_payload = 3;
  bool active = 4;
  bool truncated = 5;
  string error = 6;
}

message JointStateUpdate {
  string topic_name = 1;
  repeated string names = 2;
  repeated double positions = 3;
  bool truncated = 4;
}

message RosGraphSnapshot {
  repeated GraphNode nodes = 1;
  repeated GraphTopic topics = 2;
  repeated GraphService services = 3;
  repeated GraphAction actions = 4;
  bool truncated = 5;
}

message GraphNode {
  string name = 1;
  string namespace = 2;
}

message GraphEndpoint {
  string node_name = 1;
  string node_namespace = 2;
  string topic_type = 3;
  string reliability = 4;
  string durability = 5;
  string history = 6;
  uint32 depth = 7;
}

message GraphTopic {
  string name = 1;
  repeated string types = 2;
  repeated GraphEndpoint publishers = 3;
  repeated GraphEndpoint subscribers = 4;
}

message GraphService {
  string name = 1;
  repeated string types = 2;
  repeated string server_nodes = 3;
  repeated string client_nodes = 4;
  repeated string safe_types = 5;
}

message GraphAction {
  string name = 1;
  repeated string types = 2;
  repeated string server_nodes = 3;
  repeated string client_nodes = 4;
  repeated string safe_types = 5;
}

message ActionGoalUpdate {
  string goal_id = 1;
  string action_name = 2;
  string action_type = 3;
  string status = 4;
  string feedback_json = 5;
  string result_json = 6;
  string error = 7;
  bool terminal = 8;
  bool truncated = 9;
}

message EventRecovery {
  bool gap_detected = 1;
  uint64 oldest_available_sequence = 2;
  uint64 latest_sequence = 3;
  bool snapshot_included = 4;
  uint32 retained_critical_events = 5;
}

message NodeSnapshot {
  repeated string node_names = 1;
}

message TFUpdate {
  string parent_frame = 1;
  string child_frame = 2;
  double x = 3;
  double y = 4;
  double z = 5;
  double qx = 6;
  double qy = 7;
  double qz = 8;
  double qw = 9;
  string topic_name = 10;
  int64 source_timestamp_ms = 11;
}

message NodeStarted {
  string node_name = 1;
}

message NodeCrashed {
  string node_name = 1;
}

message TopicSnapshot {
  repeated Topic topics = 1;
}

message Topic {
  string name = 1;
  repeated string types = 2;
}

message OdometryUpdate {
  string topic_name = 1;
  double x = 2;
  double y = 3;
  double z = 4;
  double qx = 5;
  double qy = 6;
  double qz = 7;
  double qw = 8;
}